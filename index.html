<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farhan Chat // Real-time Messaging</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;
  --bg-2:#0d0b16;
  --surface:#14111f;
  --surface-2:#1b1730;
  --border:rgba(255,255,255,0.06);
  --border-bright:rgba(255,255,255,0.12);
  --border-accent:rgba(255,51,88,0.25);
  --text:#f4f1fb;
  --text-dim:#a89fb8;
  --text-mute:#6e6688;
  --crimson:#ff3358;
  --crimson-dim:rgba(255,51,88,0.10);
  --rose:#ff6b8a;
  --amber:#ffb020;
  --green:#22c55e;
  --blue-tick:#3b82f6;
  --radius:12px;
  --font-body:'Segoe UI',system-ui,-apple-system,sans-serif;
  --font-mono:'Consolas','SF Mono',monospace;
}
html{font-size:16px}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
  height:100vh;
  height:100dvh;
  -webkit-text-size-adjust:100%;
}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,51,88,0.3)}
::selection{background:rgba(255,51,88,0.25)}

/* ===== APP LAYOUT ===== */
#app{display:flex;height:100vh;height:100dvh;overflow:hidden;position:relative}

/* ===== SIDEBAR ===== */
.sidebar{
  width:380px;min-width:380px;
  background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  overflow:hidden;
  transition:transform .3s ease;
}
.sidebar-head{
  padding:16px 20px;
  background:var(--surface-2);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.sidebar-head .me{display:flex;align-items:center;gap:10px;min-width:0}
.sidebar-head .me-avatar{
  width:40px;height:40px;border-radius:50%;
  background:linear-gradient(135deg,var(--crimson),var(--amber));
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:16px;color:#fff;flex-shrink:0;
}
.sidebar-head .me-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-head .me-status{font-size:11px;color:var(--green);display:flex;align-items:center;gap:4px}
.sidebar-head .me-status::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}
.sidebar-head .actions{display:flex;gap:4px}
.icon-btn{
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:transparent;border:none;cursor:pointer;
  color:var(--text-dim);transition:all .15s ease;flex-shrink:0;
}
.icon-btn:hover{background:rgba(255,255,255,0.06);color:var(--text)}
.icon-btn svg{width:20px;height:20px;fill:currentColor}

/* Search */
.search-wrap{padding:10px 16px;background:var(--surface-2);border-bottom:1px solid var(--border)}
.search-box{
  display:flex;align-items:center;gap:8px;
  background:rgba(0,0,0,0.25);border-radius:8px;
  padding:8px 12px;border:1px solid var(--border);
}
.search-box svg{width:16px;height:16px;fill:var(--text-mute);flex-shrink:0}
.search-box input{
  flex:1;background:none;border:none;outline:none;
  color:var(--text);font-size:14px;font-family:inherit;
}
.search-box input::placeholder{color:var(--text-mute)}

/* Chat list */
.chat-list{flex:1;overflow-y:auto}
.chat-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px;cursor:pointer;
  border-bottom:1px solid var(--border);
  transition:background .15s ease;position:relative;
}
.chat-item:hover{background:rgba(255,255,255,0.03)}
.chat-item.active{background:var(--crimson-dim);border-left:3px solid var(--crimson);padding-left:13px}
.chat-avatar{
  width:48px;height:48px;border-radius:50%;flex-shrink:0;
  background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;
  font-weight:600;font-size:18px;color:var(--rose);
  border:2px solid var(--border);
}
.chat-item.online .chat-avatar{border-color:var(--green)}
.chat-info{flex:1;min-width:0}
.chat-info-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.chat-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-time{font-size:11px;color:var(--text-mute);flex-shrink:0;margin-left:8px}
.chat-info-bottom{display:flex;justify-content:space-between;align-items:center}
.chat-last{font-size:13px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.chat-badge{
  background:var(--crimson);color:#fff;
  font-size:11px;font-weight:700;min-width:20px;height:20px;
  border-radius:10px;display:flex;align-items:center;justify-content:center;
  padding:0 6px;margin-left:8px;flex-shrink:0;
}
.chat-empty{padding:40px 20px;text-align:center;color:var(--text-mute);font-size:14px}

/* New chat button */
.new-chat-btn{
  position:absolute;bottom:20px;right:20px;
  width:52px;height:52px;border-radius:50%;
  background:var(--crimson);color:#fff;
  display:flex;align-items:center;justify-content:center;
  border:none;cursor:pointer;font-size:24px;
  box-shadow:0 4px 20px rgba(255,51,88,0.35);
  transition:transform .15s ease;z-index:5;
}
.new-chat-btn:hover{transform:scale(1.08)}
.new-chat-btn svg{width:24px;height:24px;fill:#fff}

/* ===== CHAT AREA ===== */
.chat-area{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg-2)}
.chat-area::before{
  content:'';position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:
    radial-gradient(ellipse 40% 30% at 20% 10%,rgba(255,51,88,0.04) 0%,transparent 60%),
    radial-gradient(ellipse 40% 30% at 80% 90%,rgba(255,176,32,0.03) 0%,transparent 60%);
}

/* Chat header */
.chat-header{
  padding:12px 20px;background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;z-index:2;
}
.chat-header .back-btn{display:none}
.chat-header .chat-avatar{width:42px;height:42px;font-size:16px}
.chat-header-info{flex:1;min-width:0}
.chat-header-name{font-size:16px;font-weight:600}
.chat-header-status{font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:4px}
.chat-header-status.online{color:var(--green)}
.chat-header-status.online::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green)}

/* Messages */
.messages{
  flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:6px;
  position:relative;z-index:1;
}
.msg-row{display:flex;gap:8px;max-width:75%;animation:msgIn .25s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-row.me{align-self:flex-end;flex-direction:row-reverse}
.msg-bubble{
  padding:10px 14px;border-radius:14px;
  font-size:14.5px;line-height:1.45;
  word-wrap:break-word;word-break:break-word;
  position:relative;
}
.msg-row:not(.me) .msg-bubble{
  background:var(--surface-2);
  border-bottom-left-radius:4px;
  color:var(--text);
}
.msg-row.me .msg-bubble{
  background:linear-gradient(135deg,#ff3358,#e02848);
  border-bottom-right-radius:4px;
  color:#fff;
}
.msg-meta{display:flex;align-items:center;gap:4px;margin-top:3px;font-size:10px;opacity:0.7}
.msg-row.me .msg-meta{justify-content:flex-end}
.msg-row.me .msg-meta .tick{color:rgba(255,255,255,0.7)}
.msg-row.me .msg-meta .tick.read{color:#4fc3f7}
.msg-row:not(.me) .msg-meta{color:var(--text-mute)}
.msg-sender{font-size:12px;font-weight:600;color:var(--rose);margin-bottom:2px}
.msg-date-divider{
  text-align:center;font-size:11px;color:var(--text-mute);
  padding:12px 0 4px;text-transform:uppercase;letter-spacing:1px;
}

/* Typing indicator */
.typing-indicator{
  display:flex;align-items:center;gap:4px;padding:8px 14px;
  background:var(--surface-2);border-radius:14px;border-bottom-left-radius:4px;
  width:fit-content;align-self:flex-start;
}
.typing-indicator span{
  width:7px;height:7px;border-radius:50%;background:var(--text-mute);
  animation:typingBounce 1.4s infinite ease-in-out;
}
.typing-indicator span:nth-child(2){animation-delay:.2s}
.typing-indicator span:nth-child(3){animation-delay:.4s}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}

/* Input area */
.input-area{
  padding:12px 20px;background:var(--surface);
  border-top:1px solid var(--border);
  display:flex;align-items:flex-end;gap:10px;z-index:2;
}
.input-wrap{
  flex:1;display:flex;align-items:center;gap:8px;
  background:var(--surface-2);border-radius:22px;
  padding:4px 4px 4px 16px;border:1px solid var(--border);
}
.input-wrap textarea{
  flex:1;background:none;border:none;outline:none;
  color:var(--text);font-size:15px;font-family:inherit;
  resize:none;max-height:120px;min-height:24px;
  padding:8px 0;line-height:1.4;
}
.input-wrap textarea::placeholder{color:var(--text-mute)}
.emoji-btn{
  width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:none;border:none;cursor:pointer;font-size:20px;
  color:var(--text-dim);flex-shrink:0;transition:all .15s ease;
}
.emoji-btn:hover{color:var(--amber);transform:scale(1.1)}
.send-btn{
  width:44px;height:44px;border-radius:50%;
  background:var(--crimson);color:#fff;
  display:flex;align-items:center;justify-content:center;
  border:none;cursor:pointer;flex-shrink:0;
  transition:all .15s ease;
}
.send-btn:hover{transform:scale(1.08);box-shadow:0 4px 16px rgba(255,51,88,0.35)}
.send-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none}
.send-btn svg{width:20px;height:20px;fill:#fff}

/* ===== EMPTY STATE ===== */
.chat-empty-state{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;color:var(--text-mute);z-index:1;
}
.chat-empty-state svg{width:80px;height:80px;fill:var(--text-mute);opacity:0.3}
.chat-empty-state h2{font-size:20px;font-weight:600;color:var(--text-dim)}
.chat-empty-state p{font-size:14px;text-align:center;max-width:300px}

/* ===== AUTH SCREEN ===== */
.auth-screen{
  position:fixed;inset:0;z-index:200;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,rgba(20,17,31,0.95),rgba(9,8,16,0.98));
  backdrop-filter:blur(10px);
}
.auth-screen.hidden{display:none}
.auth-card{
  width:100%;max-width:400px;margin:20px;
  padding:36px 32px;
  background:rgba(20,17,31,0.8);
  backdrop-filter:blur(20px);
  border:1px solid var(--border-bright);
  border-radius:var(--radius);
  text-align:center;
}
.auth-logo{
  font-size:28px;font-weight:800;margin-bottom:6px;letter-spacing:-1px;
}
.auth-logo .accent{color:var(--crimson)}
.auth-sub{font-size:13px;color:var(--text-dim);margin-bottom:28px;font-family:var(--font-mono);letter-spacing:1px}
.auth-input{
  width:100%;padding:14px 16px;
  background:rgba(0,0,0,0.25);border:1px solid var(--border-bright);
  border-radius:8px;color:var(--text);font-size:15px;font-family:inherit;
  outline:none;margin-bottom:12px;transition:border-color .2s ease;
}
.auth-input:focus{border-color:var(--crimson)}
.auth-input::placeholder{color:var(--text-mute)}
.auth-btn{
  width:100%;padding:14px;
  background:var(--crimson);color:#fff;
  border:none;border-radius:8px;font-size:15px;font-weight:700;
  cursor:pointer;transition:all .15s ease;margin-top:8px;
}
.auth-btn:hover{background:#ff1a4a;transform:translateY(-1px);box-shadow:0 6px 20px rgba(255,51,88,0.3)}
.auth-toggle{margin-top:16px;font-size:13px;color:var(--text-dim)}
.auth-toggle a{color:var(--crimson);cursor:pointer;font-weight:600}
.auth-err{color:#ff6b6b;font-size:13px;margin-top:8px;display:none}
.auth-err.show{display:block}

/* ===== MODAL ===== */
.modal-overlay{
  position:fixed;inset:0;z-index:150;
  background:rgba(5,4,10,0.7);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:20px;
}
.modal-overlay.show{display:flex}
.modal{
  width:100%;max-width:380px;
  background:var(--surface);border:1px solid var(--border-bright);
  border-radius:var(--radius);padding:28px 24px;
}
.modal h3{font-size:18px;font-weight:700;margin-bottom:16px}
.modal-input{
  width:100%;padding:14px 16px;
  background:rgba(0,0,0,0.25);border:1px solid var(--border);
  border-radius:8px;color:var(--text);font-size:15px;font-family:inherit;
  outline:none;margin-bottom:12px;
}
.modal-input:focus{border-color:var(--crimson)}
.modal-btn{
  width:100%;padding:14px;
  background:var(--crimson);color:#fff;
  border:none;border-radius:8px;font-size:14px;font-weight:700;
  cursor:pointer;margin-top:4px;
}
.modal-btn:hover{background:#ff1a4a}

/* ===== EMOJI PICKER ===== */
.emoji-picker{
  position:absolute;bottom:70px;right:20px;
  width:280px;max-height:240px;overflow-y:auto;
  background:var(--surface);border:1px solid var(--border-bright);
  border-radius:12px;padding:12px;
  display:none;z-index:20;
  box-shadow:0 8px 32px rgba(0,0,0,0.4);
}
.emoji-picker.show{display:block}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.emoji-grid button{
  width:30px;height:30px;border:none;background:none;
  font-size:18px;cursor:pointer;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  transition:background .1s ease;
}
.emoji-grid button:hover{background:rgba(255,255,255,0.1)}

/* ===== MOBILE ===== */
@media(max-width:768px){
  .sidebar{
    width:100%;min-width:0;position:absolute;inset:0;z-index:10;
  }
  .sidebar.hidden-mobile{transform:translateX(-100%)}
  .chat-area{position:absolute;inset:0;z-index:5;transform:translateX(100%);transition:transform .3s ease}
  .chat-area.show-mobile{transform:translateX(0)}
  .chat-header .back-btn{display:flex}
  .msg-row{max-width:85%}
  .new-chat-btn{bottom:80px}
}
@media(min-width:769px){
  .back-btn{display:none}
}
</style>
</head>
<body>

<!-- ===== AUTH SCREEN ===== -->
<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <div class="auth-logo">Farhan <span class="accent">Chat</span></div>
    <div class="auth-sub">REAL-TIME MESSAGING</div>
    <form id="authForm" onsubmit="return false">
      <input class="auth-input" id="authName" type="text" placeholder="Enter your name" maxlength="20" required>
      <input class="auth-input" id="authPass" type="password" placeholder="Create a PIN (4+ digits)" maxlength="10" required>
      <div class="auth-err" id="authErr"></div>
      <button class="auth-btn" id="authBtn">Enter Chat</button>
    </form>
    <div class="auth-toggle" id="authToggle">Already have an account? <a id="authToggleLink">Login</a></div>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app" style="display:none">

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="me">
        <div class="me-avatar" id="meAvatar">F</div>
        <div>
          <div class="me-name" id="meName">Farhan</div>
          <div class="me-status">Online</div>
        </div>
      </div>
      <div class="actions">
        <button class="icon-btn" id="newChatBtn" title="New Chat">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
        </button>
        <button class="icon-btn" id="logoutBtn" title="Logout">
          <svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
        </button>
      </div>
    </div>
    <div class="search-wrap">
      <div class="search-box">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" id="searchInput" placeholder="Search chats...">
      </div>
    </div>
    <div class="chat-list" id="chatList"></div>
    <button class="new-chat-btn" id="newChatFAB" title="New Chat">
      <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
    </button>
  </div>

  <!-- CHAT AREA -->
  <div class="chat-area" id="chatArea">
    <div class="chat-empty-state" id="chatEmptyState">
      <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
      <h2>Select a chat</h2>
      <p>Choose a conversation from the sidebar or start a new chat to begin messaging.</p>
    </div>
    <div class="chat-header" id="chatHeader" style="display:none">
      <button class="icon-btn back-btn" id="backBtn">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <div class="chat-avatar" id="chatHeaderAvatar">?</div>
      <div class="chat-header-info">
        <div class="chat-header-name" id="chatHeaderName">Unknown</div>
        <div class="chat-header-status" id="chatHeaderStatus">offline</div>
      </div>
      <button class="icon-btn" title="Clear chat" id="clearChatBtn">
        <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
      </button>
    </div>
    <div class="messages" id="messages" style="display:none"></div>
    <div class="input-area" id="inputArea" style="display:none">
      <div style="position:relative">
        <button class="emoji-btn" id="emojiBtn">&#128578;</button>
        <div class="emoji-picker" id="emojiPicker">
          <div class="emoji-grid" id="emojiGrid"></div>
        </div>
      </div>
      <div class="input-wrap">
        <textarea id="msgInput" rows="1" placeholder="Type a message..."></textarea>
      </div>
      <button class="send-btn" id="sendBtn" disabled>
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- ===== NEW CHAT MODAL ===== -->
<div class="modal-overlay" id="newChatModal">
  <div class="modal">
    <h3>Start New Chat</h3>
    <input class="modal-input" id="newChatName" type="text" placeholder="Enter recipient's name" maxlength="20">
    <button class="modal-btn" id="createChatBtn">Create Chat</button>
  </div>
</div>

<script type="module">
// ===== FIREBASE CONFIG =====
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, push, onValue, onChildAdded, query, orderByChild, equalTo, get, update, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// ===== STATE =====
var currentUser = null;

// ===== AUTH =====
var isLogin = false;
var authToggle = document.getElementById('authToggle');
var authToggleLink = document.getElementById('authToggleLink');
var authBtn = document.getElementById('authBtn');

authToggleLink.addEventListener('click', function() {
  isLogin = !isLogin;
  if (isLogin) {
    authBtn.textContent = 'Login';
    authToggle.innerHTML = 'New user? <a id="authToggleLink">Sign Up</a>';
  } else {
    authBtn.textContent = 'Enter Chat';
    authToggle.innerHTML = 'Already have an account? <a id="authToggleLink">Login</a>';
  }
  document.getElementById('authToggleLink').addEventListener('click', arguments.callee);
});

document.getElementById('authForm').addEventListener('submit', function(e) {
  e.preventDefault();
  var name = document.getElementById('authName').value.trim();
  var pin = document.getElementById('authPass').value.trim();
  var errEl = document.getElementById('authErr');
  errEl.classList.remove('show');

  if (name.length < 2) { errEl.textContent = 'Name must be at least 2 characters'; errEl.classList.add('show'); return; }
  if (pin.length < 4) { errEl.textContent = 'PIN must be at least 4 digits'; errEl.classList.add('show'); return; }

  // Check if user exists
  var usersRef = ref(db, 'users/' + name.toLowerCase());
  get(usersRef).then(function(snap) {
    if (snap.exists()) {
      // Login
      if (snap.val().pin !== pin) {
        errEl.textContent = 'Wrong PIN!';
        errEl.classList.add('show');
        return;
      }
      loginUser(name, snap.val());
    } else {
      if (isLogin) {
        errEl.textContent = 'No account found with this name. Sign up first.';
        errEl.classList.add('show');
        return;
      }
      // Sign up
      set(usersRef, { name: name, pin: pin, online: true }).then(function() {
        loginUser(name, { name: name, pin: pin, online: true });
      });
    }
  }).catch(function(err) {
    errEl.textContent = 'Error: ' + err.message;
    errEl.classList.add('show');
  });
});

function loginUser(name, data) {
  currentUser = { name: name, data: data };
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('app').style.display = 'flex';

  // Set avatar
  document.getElementById('meAvatar').textContent = name[0].toUpperCase();
  document.getElementById('meName').textContent = name;

  // Mark online
  var myStatusRef = ref(db, 'users/' + name.toLowerCase() + '/online');
  set(myStatusRef, true);
  window.addEventListener('beforeunload', function() {
    set(myStatusRef, false);
  });

  // Load chat list
  loadChatList();
}

// ===== LOGOUT =====
document.getElementById('logoutBtn').addEventListener('click', function() {
  if (currentUser) {
    set(ref(db, 'users/' + currentUser.name.toLowerCase() + '/online'), false);
  }
  location.reload();
});

// ===== CHAT LIST =====
function loadChatList() {
  var chatsRef = ref(db, 'chats');
  onValue(chatsRef, function(snap) {
    var chatList = document.getElementById('chatList');
    chatList.innerHTML = '';
    var chats = [];
    var searchQ = document.getElementById('searchInput').value.toLowerCase();

    snap.forEach(function(child) {
      var chatId = child.key;
      var chatData = child.val();
      // Check if current user is part of this chat
      var participants = chatData.participants || {};
      if (!participants[currentUser.name.toLowerCase()]) return;

      // Get other participant
      var otherName = '';
      Object.keys(participants).forEach(function(p) {
        if (p !== currentUser.name.toLowerCase()) otherName = p;
      });
      if (!otherName) return;

      // Get last message
      var messages = chatData.messages || {};
      var lastMsg = '';
      var lastTime = 0;
      Object.keys(messages).forEach(function(k) {
        if (messages[k].timestamp > lastTime) {
          lastTime = messages[k].timestamp;
          lastMsg = messages[k].text;
        }
      });

      // Filter by search
      if (searchQ && otherName.indexOf(searchQ) === -1) return;

      chats.push({ chatId: chatId, otherName: otherName, lastMsg: lastMsg, lastTime: lastTime });
    });

    // Sort by last message time
    chats.sort(function(a, b) { return b.lastTime - a.lastTime; });

    if (chats.length === 0) {
      chatList.innerHTML = '<div class="chat-empty">No chats yet.<br>Tap + to start a new conversation.</div>';
      return;
    }

    // Get online status of each other user
    chats.forEach(function(c) {
      get(ref(db, 'users/' + c.otherName)).then(function(userSnap) {
        var userData = userSnap.val() || {};
        var isOnline = userData.online || false;

        var div = document.createElement('div');
        div.className = 'chat-item' + (isOnline ? ' online' : '') + (c.chatId === currentChatId ? ' active' : '');
        div.dataset.chatId = c.chatId;
        div.dataset.otherName = c.otherName;
        div.innerHTML =
          '<div class="chat-avatar">' + c.otherName[0].toUpperCase() + '</div>' +
          '<div class="chat-info">' +
            '<div class="chat-info-top">' +
              '<span class="chat-name">' + c.otherName + '</span>' +
              '<span class="chat-time">' + (c.lastTime ? formatTime(c.lastTime) : '') + '</span>' +
            '</div>' +
            '<div class="chat-info-bottom">' +
              '<span class="chat-last">' + (c.lastMsg || 'No messages yet') + '</span>' +
            '</div>' +
          '</div>';

        div.addEventListener('click', function() {
          openChat(c.chatId, c.otherName, isOnline);
        });
        chatList.appendChild(div);
      });
    });
  });
}

// Search
document.getElementById('searchInput').addEventListener('input', function() {
  loadChatList();
});

// ===== OPEN CHAT =====
function openChat(chatId, otherName, isOnline) {
  currentChatId = chatId;
  currentChatUser = otherName;

  // Show chat UI
  document.getElementById('chatEmptyState').style.display = 'none';
  document.getElementById('chatHeader').style.display = 'flex';
  document.getElementById('messages').style.display = 'flex';
  document.getElementById('inputArea').style.display = 'flex';

  // Update header
  document.getElementById('chatHeaderAvatar').textContent = otherName[0].toUpperCase();
  document.getElementById('chatHeaderName').textContent = otherName;
  var statusEl = document.getElementById('chatHeaderStatus');
  if (isOnline) {
    statusEl.textContent = 'online';
    statusEl.classList.add('online');
  } else {
    statusEl.textContent = 'offline';
    statusEl.classList.remove('online');
  }

  // Update active in sidebar
  document.querySelectorAll('.chat-item').forEach(function(el) {
    el.classList.remove('active');
    if (el.dataset.chatId === chatId) el.classList.add('active');
  });

  // Mobile: show chat area
  document.getElementById('chatArea').classList.add('show-mobile');
  document.getElementById('sidebar').classList.add('hidden-mobile');

  // Clear messages
  var msgContainer = document.getElementById('messages');
  msgContainer.innerHTML = '';

  // Listen for messages
  if (messagesRef) {
    // Remove old listener by re-querying
  }
  var msgRef = ref(db, 'chats/' + chatId + '/messages');
  onValue(msgRef, function(snap) {
    msgContainer.innerHTML = '';
    var lastDate = '';
    snap.forEach(function(child) {
      var msg = child.val();
      var msgDate = formatDate(msg.timestamp);
      if (msgDate !== lastDate) {
        var divider = document.createElement('div');
        divider.className = 'msg-date-divider';
        divider.textContent = msgDate;
        msgContainer.appendChild(divider);
        lastDate = msgDate;
      }

      var isMe = msg.sender === currentUser.name.toLowerCase();
      var row = document.createElement('div');
      row.className = 'msg-row' + (isMe ? ' me' : '');
      var tickHTML = isMe ? '<span class="tick' + (msg.read ? ' read' : '') + '">&#10003;&#10003;</span>' : '';
      row.innerHTML =
        '<div class="msg-bubble">' +
          (isMe ? '' : '<div class="msg-sender">' + msg.sender + '</div>') +
          escapeHtml(msg.text) +
          '<div class="msg-meta">' + formatTime(msg.timestamp) + ' ' + tickHTML + '</div>' +
        '</div>';
      msgContainer.appendChild(row);

      // Mark as read if not from me
      if (!isMe) {
        update(ref(db, 'chats/' + chatId + '/messages/' + child.key), { read: true });
      }
    });

    // Scroll to bottom
    msgContainer.scrollTop = msgContainer.scrollHeight;

    // Listen for typing
    var typingRef = ref(db, 'chats/' + chatId + '/typing/' + otherName.toLowerCase());
    onValue(typingRef, function(tSnap) {
      // Remove old typing indicator
      var oldTyping = document.querySelector('.typing-indicator');
      if (oldTyping) oldTyping.remove();

      if (tSnap.val() === true) {
        var typing = document.createElement('div');
        typing.className = 'typing-indicator';
        typing.innerHTML = '<span></span><span></span><span></span>';
        msgContainer.appendChild(typing);
        msgContainer.scrollTop = msgContainer.scrollHeight;
      }
    });
  });

  // Listen for online status changes
  onValue(ref(db, 'users/' + otherName.toLowerCase() + '/online'), function(oSnap) {
    var online = oSnap.val();
    if (online) {
      statusEl.textContent = 'online';
      statusEl.classList.add('online');
    } else {
      statusEl.textContent = 'offline';
      statusEl.classList.remove('online');
    }
  });
}

// ===== SEND MESSAGE =====
var msgInput = document.getElementById('msgInput');
var sendBtn = document.getElementById('sendBtn');

msgInput.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  sendBtn.disabled = this.value.trim().length === 0;

  // Typing indicator
  if (currentChatId && currentUser) {
    var typingRef = ref(db, 'chats/' + currentChatId + '/typing/' + currentUser.name.toLowerCase());
    if (this.value.trim().length > 0) {
      set(typingRef, true);
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(function() { set(typingRef, false); }, 2000);
    } else {
      set(typingRef, false);
    }
  }
});

msgInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

sendBtn.addEventListener('click', sendMessage);

function sendMessage() {
  var text = msgInput.value.trim();
  if (!text || !currentChatId) return;

  var msgRef = push(ref(db, 'chats/' + currentChatId + '/messages'));
  set(msgRef, {
    sender: currentUser.name.toLowerCase(),
    text: text,
    timestamp: Date.now(),
    read: false
  });

  // Clear input
  msgInput.value = '';
  msgInput.style.height = 'auto';
  sendBtn.disabled = true;

  // Clear typing
  set(ref(db, 'chats/' + currentChatId + '/typing/' + currentUser.name.toLowerCase()), false);
}

// ===== NEW CHAT =====
var newChatModal = document.getElementById('newChatModal');
document.getElementById('newChatBtn').addEventListener('click', openNewChat);
document.getElementById('newChatFAB').addEventListener('click', openNewChat);

function openNewChat() {
  newChatModal.classList.add('show');
  document.getElementById('newChatName').focus();
}

document.getElementById('newChatName').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') createNewChat();
});

document.getElementById('createChatBtn').addEventListener('click', createNewChat);

function createNewChat() {
  var name = document.getElementById('newChatName').value.trim();
  if (!name || !currentUser) return;
  if (name.toLowerCase() === currentUser.name.toLowerCase()) {
    alert("You can't chat with yourself!");
    return;
  }

  // Generate chat ID from sorted names
  var names = [currentUser.name.toLowerCase(), name.toLowerCase()].sort();
  var chatId = names[0] + '_' + names[1];

  // Create chat if doesn't exist
  var chatRef = ref(db, 'chats/' + chatId);
  get(chatRef).then(function(snap) {
    if (!snap.exists()) {
      set(chatRef, {
        participants: {},
        messages: {},
        createdAt: Date.now()
      });
      update(ref(db, 'chats/' + chatId + '/participants'), {
        [currentUser.name.toLowerCase()]: true,
        [name.toLowerCase()]: true
      });
    }
    newChatModal.classList.remove('show');
    document.getElementById('newChatName').value = '';
    openChat(chatId, name, false);
  });
}

// Close modal on overlay click
newChatModal.addEventListener('click', function(e) {
  if (e.target === newChatModal) newChatModal.classList.remove('show');
});

document.getElementById('clearChatBtn').addEventListener('click', function() {

  if (confirm('Clear all messages in this chat?')) {
    remove(ref(db, 'chats/' + currentChatId + '/messages'));
  }
});

// ===== HELPERS =====
function formatTime(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  var h = d.getHours();
  var m = d.getMinutes();
  var ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return h + ':' + (m < 10 ? '0' : '') + m + ' ' + ampm;
}

function formatDate(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  var today = new Date();
  var yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);

  if (d.toDateString() === today.toDateString()) return 'Today';
  if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

function escapeHtml(text) {
  var div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}
